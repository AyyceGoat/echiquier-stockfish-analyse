[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# --- Isolation multi-origine ---
# COOP + COEP rendent `SharedArrayBuffer` disponible, donc Stockfish
# multi-thread. Tous les sous-ressources du site sont de même origine, donc
# `require-corp` ne casse rien. Les navigateurs qui n'appliquent pas ces
# en-têtes (certaines WebView Android) n'obtiennent simplement pas
# `crossOriginIsolated` : l'application bascule alors d'elle-même sur le
# build mono-thread, sans erreur visible.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    # Politique de sécurité du contenu.
    #
    # L'application n'injecte jamais de HTML et ne charge aucun script tiers :
    # la politique peut donc être stricte sans rien casser. `wasm-unsafe-eval`
    # est indispensable — Stockfish est un module WebAssembly, et sans lui le
    # moteur ne démarre pas. `blob:` couvre les workers et les URL d'objet
    # créées pour l'aperçu des images importées.
    #
    # `frame-ancestors 'none'` remplace X-Frame-Options, qu'aucun navigateur
    # récent ne privilégie plus : le site ne doit jamais être encadré par un
    # tiers.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    # HSTS : Netlify sert déjà en HTTPS, l'en-tête interdit la rétrogradation.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Le document lui-même ne doit jamais être servi depuis un cache périmé,
# sinon une mise à jour ne parvient pas à l'appareil.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify ne connaît pas l'extension .webmanifest et la sert en
# application/octet-stream : les navigateurs refusent alors de lire le
# manifeste, et l'application n'est plus installable. Le type est donc
# déclaré explicitement.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Les noms de fichiers produits par Vite contiennent un hachage de contenu.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le chemin du moteur porte son numéro de version : le contenu y est immuable.
# C'est ce qui garantit qu'une mise à jour de Stockfish ne peut pas être
# servie depuis un cache contenant l'ancien WASM.
[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/engine/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Application monopage : toute route inconnue rend index.html.
# La règle passe après les fonctions (/api/*), qui ont leur propre routage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
